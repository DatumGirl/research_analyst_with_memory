[project]
name = "research-analyst"
version = "0.1.0"
description = "A research analyst agent built with LangGraph: parallel researchers, a critic loop, persistent memory, plan review, evaluation, and cost-aware routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-anthropic",
    "langchain-core",
    "pydantic",
    "python-dotenv",
    "tavily-python",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mlflow>=3.16.1",
]

[project.scripts]
research-analyst = "research_analyst.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
